<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>NXP Cup Relay</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #07151b; color: #e9f7fb; }
    main { max-width: 1280px; margin: auto; padding: clamp(10px, 2vw, 24px); }
    h1 { margin: 0; font-size: clamp(1.35rem, 3vw, 2rem); }
    .toolbar { display: flex; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 12px; }
    #status { color: #63dcff; margin: 5px 0 0; }
    .modes { display: flex; flex-wrap: wrap; gap: 8px; }
    .mode-button {
      min-width: 4.5rem; padding: 9px 14px; border: 1px solid #34778d; border-radius: 7px;
      background: #102a35; color: #e9f7fb; font-weight: 700; text-align: center; text-decoration: none;
    }
    .mode-button:hover { background: #174052; }
    .mode-button.active { border-color: #63dcff; background: #14627d; color: #fff; }
    .video-shell { width: 100%; aspect-ratio: 8 / 5; background: #000; }
    canvas, video {
      display: block; width: 100%; height: 100%; object-fit: contain;
      image-rendering: pixelated; background: #000; border: 1px solid #34778d; box-sizing: border-box;
    }
    [hidden] { display: none !important; }
    pre { white-space: pre-wrap; background: #102a35; padding: 12px; }
    table { border-collapse: collapse; width: 100%; }
    td, th { padding: 5px 8px; border-bottom: 1px solid #214654; text-align: left; }
    @media (max-width: 640px) {
      .toolbar { align-items: stretch; flex-direction: column; }
      .modes { display: grid; grid-template-columns: repeat(3, 1fr); }
    }
  </style>
</head>
<body>
<main>
  <div class="toolbar">
    <div>
      <h1>NXP Cup Camera Relay</h1>
      <p id="status">Connecting...</p>
    </div>
    <nav class="modes" aria-label="Video mode">
      <a class="mode-button" data-video="jpeg" href="?video=jpeg&amp;replace=1">JPEG</a>
      <a class="mode-button" data-video="h264" href="?video=h264&amp;replace=1">H.264</a>
      <a class="mode-button" data-video="raw" href="?video=raw&amp;replace=1">Raw</a>
    </nav>
  </div>
  <div class="video-shell">
    <canvas id="camera" width="320" height="200"></canvas>
    <video id="h264" width="320" height="200" muted autoplay playsinline hidden></video>
  </div>
  <pre id="metrics">Waiting for health...</pre>
  <h2>Telemetry</h2>
  <table><thead><tr><th>Name</th><th>Value</th><th>Units</th></tr></thead><tbody id="telemetry"></tbody></table>
</main>
<script>
(() => {
  'use strict';
  const AVCU_MAGIC = 0x55435641;
  const JPEG_MAGIC = 0x4a435641;
  const H264_MAGIC = 0x34435641;
  const RAW_MAGIC = 0x52435641;
  const JPEG_HEADER_BYTES = 32;
  const H264_HEADER_BYTES = 32;
  const RAW_HEADER_BYTES = 32;
  const RAW_PIXEL_FORMAT_RGB565_LE = 1;
  const H264_FLAG_INITIALIZATION = 1;
  const MAX_MSE_QUEUE = 48;
  const MSG_TELEMETRY = 0x01000500;
  const TELEMETRY_TEXT_MAX_BYTES = 48;
  const status = document.querySelector('#status');
  const metrics = document.querySelector('#metrics');
  const telemetryBody = document.querySelector('#telemetry');
  const canvas = document.querySelector('#camera');
  const video = document.querySelector('#h264');
  const context = canvas.getContext('2d', { alpha: false });
  const rawImage = context.createImageData(320, 200);
  const telemetry = new Map();
  const decoder = new TextDecoder();
  let pendingJpeg = null;
  let decodingJpeg = false;
  let lastFrameId = -1;
  let displayed = 0;
  let lastRateTime = performance.now();
  let currentSocket = null;
  let mediaSource = null;
  let sourceBuffer = null;
  let mediaUrl = null;
  let mseQueue = [];
  const pageParameters = new URLSearchParams(location.search);
  const requestedVideo = ['raw', 'jpeg', 'h264'].includes(pageParameters.get('video'))
    ? pageParameters.get('video')
    : 'jpeg';
  document.querySelectorAll('[data-video]').forEach(button => {
    const active = button.dataset.video === requestedVideo;
    button.classList.toggle('active', active);
    button.setAttribute('aria-current', active ? 'page' : 'false');
  });

  function codecName(codecConfig) {
    return `avc1.${codecConfig.toString(16).padStart(6, '0')}`;
  }

  function closeForMseError(error) {
    console.error('AVC H.264 MSE', error);
    status.textContent = `H.264 playback error: ${error}`;
    if (currentSocket) currentSocket.close();
  }

  function pumpMse() {
    if (!sourceBuffer || sourceBuffer.updating) return;
    if (sourceBuffer.buffered.length && video.currentTime < sourceBuffer.buffered.start(0)) {
      video.currentTime = sourceBuffer.buffered.start(0);
      void video.play().catch(() => {});
    }
    if (mseQueue.length > 0) {
      try { sourceBuffer.appendBuffer(mseQueue.shift()); }
      catch (error) { closeForMseError(error); }
      return;
    }
    if (sourceBuffer.buffered.length && video.currentTime > 8) {
      const removeBefore = video.currentTime - 4;
      if (sourceBuffer.buffered.start(0) < removeBefore) {
        try { sourceBuffer.remove(0, removeBefore); }
        catch (error) { closeForMseError(error); }
      }
    }
  }

  function beginH264(initialization, codecConfig) {
    mseQueue = [initialization];
    sourceBuffer = null;
    if (mediaSource && mediaSource.readyState === 'open') {
      try { mediaSource.endOfStream(); } catch (_) {}
    }
    if (mediaUrl) URL.revokeObjectURL(mediaUrl);
    mediaSource = new MediaSource();
    mediaUrl = URL.createObjectURL(mediaSource);
    video.src = mediaUrl;
    video.hidden = false;
    canvas.hidden = true;
    mediaSource.addEventListener('sourceopen', () => {
      try {
        const mime = `video/mp4; codecs="${codecName(codecConfig)}"`;
        if (!MediaSource.isTypeSupported(mime)) throw new Error(`unsupported ${mime}`);
        sourceBuffer = mediaSource.addSourceBuffer(mime);
        sourceBuffer.mode = 'segments';
        sourceBuffer.addEventListener('updateend', pumpMse);
        sourceBuffer.addEventListener('error', () => closeForMseError('SourceBuffer error'));
        pumpMse();
        void video.play().catch(() => {});
      } catch (error) { closeForMseError(error); }
    }, { once: true });
  }

  function queueH264(fragment) {
    if (!mediaSource) return;
    if (mseQueue.length >= MAX_MSE_QUEUE) {
      closeForMseError('decoder queue exceeded its bounded limit');
      return;
    }
    mseQueue.push(fragment);
    pumpMse();
  }

  if ('requestVideoFrameCallback' in video) {
    const countVideoFrame = () => {
      displayed++;
      const now = performance.now();
      if (now - lastRateTime >= 1000) {
        status.textContent = `Live H.264 - frame ${lastFrameId}, browser frames ${displayed}`;
        lastRateTime = now;
      }
      video.requestVideoFrameCallback(countVideoFrame);
    };
    video.requestVideoFrameCallback(countVideoFrame);
  }

  async function drainJpeg() {
    if (decodingJpeg) return;
    decodingJpeg = true;
    while (pendingJpeg !== null) {
      const frame = pendingJpeg;
      pendingJpeg = null;
      try {
        const bitmap = await createImageBitmap(
          new Blob([new Uint8Array(frame.buffer, JPEG_HEADER_BYTES, frame.jpegBytes)], { type: 'image/jpeg' })
        );
        context.drawImage(bitmap, 0, 0, 320, 200);
        bitmap.close();
        lastFrameId = frame.frameId;
        displayed++;
      } catch (error) {
        status.textContent = `JPEG decode error: ${error}`;
      }
      const now = performance.now();
      if (now - lastRateTime >= 1000) {
        status.textContent = `Live JPEG - frame ${lastFrameId}, browser frames ${displayed}`;
        lastRateTime = now;
      }
    }
    decodingJpeg = false;
  }

  function showRaw(buffer, view, rawBytes) {
    const source = new Uint8Array(buffer, RAW_HEADER_BYTES, rawBytes);
    const destination = rawImage.data;
    for (let sourceIndex = 0, pixelIndex = 0; sourceIndex < source.length; sourceIndex += 2, pixelIndex += 4) {
      const pixel = source[sourceIndex] | (source[sourceIndex + 1] << 8);
      destination[pixelIndex] = Math.round(((pixel >>> 11) & 0x1f) * 255 / 31);
      destination[pixelIndex + 1] = Math.round(((pixel >>> 5) & 0x3f) * 255 / 63);
      destination[pixelIndex + 2] = Math.round((pixel & 0x1f) * 255 / 31);
      destination[pixelIndex + 3] = 255;
    }
    video.hidden = true;
    canvas.hidden = false;
    context.putImageData(rawImage, 0, 0);
    lastFrameId = view.getUint32(8, true);
    displayed++;
    const now = performance.now();
    if (now - lastRateTime >= 1000) {
      status.textContent = `Live raw RGB565 - frame ${lastFrameId}, browser frames ${displayed}`;
      lastRateTime = now;
    }
  }

  function showTelemetry(view, payloadStart, payloadLength) {
    if (payloadLength < 16) return;
    const valueBits = view.getUint32(payloadStart + 8, true);
    const nameBytes = view.getUint16(payloadStart + 12, true);
    const type = view.getUint8(payloadStart + 14);
    const unitsBytes = view.getUint8(payloadStart + 15);
    const textValue = type === 5;
    const textBytes = textValue ? valueBits : 0;
    if (
      16 + nameBytes + unitsBytes + textBytes !== payloadLength || nameBytes === 0 ||
      type < 1 || type > 5 ||
      (textValue && (textBytes === 0 || textBytes > TELEMETRY_TEXT_MAX_BYTES || unitsBytes !== 0))
    ) return;
    const bytes = new Uint8Array(
      view.buffer,
      view.byteOffset + payloadStart + 16,
      nameBytes + unitsBytes + textBytes,
    );
    const name = decoder.decode(bytes.subarray(0, nameBytes));
    const units = decoder.decode(bytes.subarray(nameBytes, nameBytes + unitsBytes));
    let value;
    if (type === 1) value = view.getInt32(payloadStart + 8, true);
    else if (type === 2) value = valueBits;
    else if (type === 3) value = view.getFloat32(payloadStart + 8, true).toFixed(3);
    else if (type === 4) value = valueBits ? 'true' : 'false';
    else value = decoder.decode(bytes.subarray(nameBytes + unitsBytes));
    telemetry.set(name, { value, units });
    telemetryBody.replaceChildren(...[...telemetry.entries()].map(([key, item]) => {
      const row = document.createElement('tr');
      for (const text of [key, String(item.value), item.units]) {
        const cell = document.createElement('td');
        cell.textContent = text;
        row.appendChild(cell);
      }
      return row;
    }));
  }

  function receivePacket(buffer) {
    const view = new DataView(buffer);
    if (view.byteLength < 32) return;
    const magic = view.getUint32(0, true);
    if (magic === JPEG_MAGIC) {
      const jpegBytes = view.getUint32(16, true);
      if (
        view.getUint8(4) !== 1 || view.getUint8(5) !== JPEG_HEADER_BYTES ||
        view.getUint16(12, true) !== 320 || view.getUint16(14, true) !== 200 ||
        JPEG_HEADER_BYTES + jpegBytes !== view.byteLength || jpegBytes < 4 ||
        view.getUint8(JPEG_HEADER_BYTES) !== 0xff || view.getUint8(JPEG_HEADER_BYTES + 1) !== 0xd8 ||
        view.getUint8(view.byteLength - 2) !== 0xff || view.getUint8(view.byteLength - 1) !== 0xd9
      ) return;
      video.hidden = true;
      canvas.hidden = false;
      pendingJpeg = { buffer, jpegBytes, frameId: view.getUint32(8, true) };
      void drainJpeg();
      return;
    }
    if (magic === H264_MAGIC) {
      const flags = view.getUint16(6, true);
      const payloadBytes = view.getUint32(16, true);
      if (
        view.getUint8(4) !== 1 || view.getUint8(5) !== H264_HEADER_BYTES ||
        view.getUint16(12, true) !== 320 || view.getUint16(14, true) !== 200 ||
        H264_HEADER_BYTES + payloadBytes !== view.byteLength
      ) return;
      lastFrameId = view.getUint32(8, true);
      const payload = buffer.slice(H264_HEADER_BYTES);
      if (flags & H264_FLAG_INITIALIZATION) beginH264(payload, view.getUint32(28, true));
      else queueH264(payload);
      return;
    }
    if (magic === RAW_MAGIC) {
      const rawBytes = view.getUint32(16, true);
      if (
        view.getUint8(4) !== 1 || view.getUint8(5) !== RAW_HEADER_BYTES ||
        view.getUint16(12, true) !== 320 || view.getUint16(14, true) !== 200 ||
        rawBytes !== 320 * 200 * 2 || RAW_HEADER_BYTES + rawBytes !== view.byteLength ||
        view.getUint32(28, true) !== RAW_PIXEL_FORMAT_RGB565_LE
      ) return;
      showRaw(buffer, view, rawBytes);
      return;
    }
    if (magic !== AVCU_MAGIC || view.getUint8(4) !== 1 || view.getUint8(5) !== 32) return;
    const messageId = view.getUint32(8, true);
    const payloadLength = view.getUint32(16, true);
    if (32 + payloadLength !== view.byteLength) return;
    if (messageId === MSG_TELEMETRY) {
      showTelemetry(view, 32, payloadLength);
    }
  }

  function connect() {
    const streamParameters = new URLSearchParams({ video: requestedVideo });
    if (pageParameters.has('replace')) streamParameters.set('replace', '1');
    const socket = new WebSocket(`ws://${location.host}/stream?${streamParameters}`);
    currentSocket = socket;
    socket.binaryType = 'arraybuffer';
    socket.onopen = () => { status.textContent = `Connected (${requestedVideo}); waiting for frame...`; };
    socket.onmessage = event => receivePacket(event.data);
    socket.onerror = () => socket.close();
    socket.onclose = () => { status.textContent = 'Disconnected; retrying...'; setTimeout(connect, 1000); };
  }

  async function pollHealth() {
    try { metrics.textContent = JSON.stringify(await (await fetch('/health', { cache: 'no-store' })).json(), null, 2); }
    catch (error) { metrics.textContent = `Health error: ${error}`; }
    setTimeout(pollHealth, 1000);
  }

  connect();
  pollHealth();
})();
</script>
</body>
</html>
