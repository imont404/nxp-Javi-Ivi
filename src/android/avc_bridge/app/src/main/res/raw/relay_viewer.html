<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>AVC Relay</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #07151b; color: #e9f7fb; }
    main { max-width: 960px; margin: auto; padding: 16px; }
    canvas { width: 100%; image-rendering: pixelated; background: #000; border: 1px solid #34778d; }
    #status { color: #63dcff; }
    pre { white-space: pre-wrap; background: #102a35; padding: 12px; }
    table { border-collapse: collapse; width: 100%; }
    td, th { padding: 5px 8px; border-bottom: 1px solid #214654; text-align: left; }
  </style>
</head>
<body>
<main>
  <h1>AVC Camera Relay</h1>
  <p id="status">Connecting...</p>
  <canvas id="camera" width="320" height="200"></canvas>
  <pre id="metrics">Waiting for health...</pre>
  <h2>Telemetry</h2>
  <table><thead><tr><th>Name</th><th>Value</th><th>Units</th></tr></thead><tbody id="telemetry"></tbody></table>
</main>
<script>
(() => {
  'use strict';
  const MAGIC = 0x55435641;
  const MSG_FRAME = 0x01000002;
  const MSG_TELEMETRY = 0x01000500;
  const FLAG_DROPPED_BEFORE = 1 << 3;
  const FRAME_START = 1;
  const FRAME_END = 2;
  const FRAME_BYTES = 320 * 200 * 2;
  const status = document.querySelector('#status');
  const metrics = document.querySelector('#metrics');
  const telemetryBody = document.querySelector('#telemetry');
  const context = document.querySelector('#camera').getContext('2d', { alpha: false });
  const image = context.createImageData(320, 200);
  const pixels = new Uint8Array(FRAME_BYTES);
  const telemetry = new Map();
  const decoder = new TextDecoder();
  let activeFrame = null;
  let nextOffset = 0;
  let displayed = 0;
  let lastRateTime = performance.now();

  function renderFrame() {
    for (let source = 0, target = 0; source < FRAME_BYTES; source += 2, target += 4) {
      const rgb = pixels[source] | (pixels[source + 1] << 8);
      image.data[target] = Math.round(((rgb >> 11) & 31) * 255 / 31);
      image.data[target + 1] = Math.round(((rgb >> 5) & 63) * 255 / 63);
      image.data[target + 2] = Math.round((rgb & 31) * 255 / 31);
      image.data[target + 3] = 255;
    }
    context.putImageData(image, 0, 0);
    displayed++;
    const now = performance.now();
    if (now - lastRateTime >= 1000) {
      status.textContent = `Live - frame ${activeFrame}, browser frames ${displayed}`;
      lastRateTime = now;
    }
  }

  function showTelemetry(view, payloadStart, payloadLength) {
    if (payloadLength < 16) return;
    const valueBits = view.getUint32(payloadStart + 8, true);
    const nameBytes = view.getUint16(payloadStart + 12, true);
    const type = view.getUint8(payloadStart + 14);
    const unitsBytes = view.getUint8(payloadStart + 15);
    if (16 + nameBytes + unitsBytes !== payloadLength || nameBytes === 0) return;
    const bytes = new Uint8Array(view.buffer, view.byteOffset + payloadStart + 16, nameBytes + unitsBytes);
    const name = decoder.decode(bytes.subarray(0, nameBytes));
    const units = decoder.decode(bytes.subarray(nameBytes));
    let value;
    if (type === 1) value = view.getInt32(payloadStart + 8, true);
    else if (type === 2) value = valueBits;
    else if (type === 3) value = view.getFloat32(payloadStart + 8, true).toFixed(3);
    else if (type === 4) value = valueBits ? 'true' : 'false';
    else return;
    telemetry.set(name, { value, units });
    telemetryBody.replaceChildren(...[...telemetry.entries()].map(([key, item]) => {
      const row = document.createElement('tr');
      for (const text of [key, String(item.value), item.units]) {
        const cell = document.createElement('td');
        cell.textContent = text;
        row.appendChild(cell);
      }
      return row;
    }));
  }

  function receivePacket(buffer) {
    const view = new DataView(buffer);
    if (view.byteLength < 32 || view.getUint32(0, true) !== MAGIC || view.getUint8(4) !== 1 || view.getUint8(5) !== 32) return;
    const flags = view.getUint16(6, true);
    const messageId = view.getUint32(8, true);
    const payloadLength = view.getUint32(16, true);
    if (32 + payloadLength !== view.byteLength) return;
    if (messageId === MSG_TELEMETRY) {
      showTelemetry(view, 32, payloadLength);
      return;
    }
    if (messageId !== MSG_FRAME || payloadLength <= 24) return;
    const frameId = view.getUint32(32, true);
    const offset = view.getUint32(36, true);
    const total = view.getUint32(40, true);
    const width = view.getUint16(44, true);
    const height = view.getUint16(46, true);
    const format = view.getUint16(48, true);
    const chunkFlags = view.getUint32(52, true);
    const dataBytes = payloadLength - 24;
    if ((flags & FLAG_DROPPED_BEFORE) !== 0) { activeFrame = null; nextOffset = 0; }
    if (total !== FRAME_BYTES || width !== 320 || height !== 200 || format !== 1 || offset + dataBytes > total) return;
    if ((chunkFlags & FRAME_START) !== 0) {
      if (offset !== 0) return;
      activeFrame = frameId;
      nextOffset = 0;
    }
    if (activeFrame !== frameId || offset !== nextOffset) { activeFrame = null; nextOffset = 0; return; }
    pixels.set(new Uint8Array(buffer, 32 + 24, dataBytes), offset);
    nextOffset += dataBytes;
    if ((chunkFlags & FRAME_END) !== 0) {
      if (nextOffset === FRAME_BYTES) renderFrame();
      activeFrame = null;
      nextOffset = 0;
    }
  }

  function connect() {
    const socket = new WebSocket(`ws://${location.host}/stream`);
    socket.binaryType = 'arraybuffer';
    socket.onopen = () => { status.textContent = 'Connected; waiting for frame...'; };
    socket.onmessage = event => receivePacket(event.data);
    socket.onerror = () => socket.close();
    socket.onclose = () => { status.textContent = 'Disconnected; retrying...'; setTimeout(connect, 1000); };
  }

  async function pollHealth() {
    try { metrics.textContent = JSON.stringify(await (await fetch('/health', { cache: 'no-store' })).json(), null, 2); }
    catch (error) { metrics.textContent = `Health error: ${error}`; }
    setTimeout(pollHealth, 1000);
  }

  connect();
  pollHealth();
})();
</script>
</body>
</html>
